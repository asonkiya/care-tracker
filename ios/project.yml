name: CareTracker
options:
  bundleIdPrefix: com.ahrimane
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: Z428Z377RQ
targets:
  CareTracker:
    type: application
    platform: iOS
    sources: [CareTracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahrimane.caretracker   # must match the app you create in App Store Connect
        PRODUCT_NAME: CareTracker
        INFOPLIST_FILE: CareTracker/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme: {}
